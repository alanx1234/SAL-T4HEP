apiVersion: batch/v1
kind: Job
metadata:
  name: alan-jetclass-2m-benchmark
  namespace: cms-ml
spec:
  completions: 30
  parallelism: 30
  completionMode: Indexed
  backoffLimit: 4
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-RTX-A5000
                      - NVIDIA-Quadro-RTX-6000
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-Quadro-RTX-8000
      restartPolicy: Never
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: j-jepa-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      containers:
        - name: training
          image: gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network:latest
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euxo pipefail

              # indices 0-2:    JEDI-Linear trials 0,1,2
              # indices 3-5:    Transformer trials 0,1,2
              # indices 6-8:    PTv3 config1 trials 0,1,2
              # indices 9-11:   PTv3 config2 trials 0,1,2
              # indices 12-14:  PTv3 config3 trials 0,1,2
              # indices 15-17:  LorentzNet unconstrained trials 0,1,2
              # indices 18-20:  L-GATr unconstrained trials 0,1,2
              # indices 21-23:  SAL-T 1.3M-FLOPs config trials 0,1,2
              # indices 24-26:  ParT 1.3M-FLOPs config trials 0,1,2
              # indices 27-29:  Linformer 1.3M-FLOPs config trials 0,1,2

              IDX=$JOB_COMPLETION_INDEX
              MODEL_IDX=$((IDX / 3))
              TRIAL_IDX=$((IDX % 3))

              REPO_DIR="/tmp/sal_t_jetclass_2m_benchmark"
              REPO_REF="${REPO_REF:-iclr}"
              if [ -d "$REPO_DIR/.git" ]; then
                cd "$REPO_DIR"
                git fetch --all
                git checkout "$REPO_REF"
                git pull || true
              else
                git clone https://github.com/alanx1234/SAL-T4HEP.git "$REPO_DIR"
                cd "$REPO_DIR"
                git checkout "$REPO_REF"
              fi

              DATA_DIR="${DATA_DIR:-/j-jepa-vol/linformer_data/JetClass/kinematics_2m}"
              SAVE_BASE="${SAVE_BASE:-/j-jepa-vol/jetclass_2m_benchmark_runs}"
              RUN_TAG="idx-${IDX}-trial-${TRIAL_IDX}"
              mkdir -p "$SAVE_BASE"

              test -f "$DATA_DIR/train/features.npy"
              test -f "$DATA_DIR/train/vectors.npy"
              test -f "$DATA_DIR/train/labels.npy"
              test -f "$DATA_DIR/val/features.npy"
              test -f "$DATA_DIR/val/vectors.npy"
              test -f "$DATA_DIR/val/labels.npy"
              test -f "$DATA_DIR/test/features.npy"
              test -f "$DATA_DIR/test/vectors.npy"
              test -f "$DATA_DIR/test/labels.npy"

              cd "$REPO_DIR/scripts"
              python3 -m py_compile \
                train_jedi_linear.py \
                train_transformer.py \
                train_point_transformer.py \
                train_lorentznet.py \
                train_lgatr.py \
                train_linformer.py \
                train_part.py

              if [ "$MODEL_IDX" -eq 0 ]; then
                echo "=== JetClass 2M: JEDI-Linear (index=$IDX) ==="
                python3 train_jedi_linear.py \
                  --data_dir       "$DATA_DIR" \
                  --save_dir       "$SAVE_BASE/jedi_linear/$RUN_TAG" \
                  --dataset        jetclass \
                  --sort_by        kt \
                  --preset         custom \
                  --embedding_dim  20 \
                  --num_blocks     2 \
                  --channel_hidden 40 \
                  --head_hidden    20 \
                  --aggregation    mean \
                  --schedule       none \
                  --batch_size     1024 \
                  --num_epochs     500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 1 ]; then
                echo "=== JetClass 2M: Transformer (index=$IDX) ==="
                python3 train_transformer.py \
                  --data_dir      "$DATA_DIR" \
                  --save_dir      "$SAVE_BASE/transformer/$RUN_TAG" \
                  --dataset       jetclass \
                  --sort_by       kt \
                  --num_particles 150 \
                  --d_model       8 \
                  --d_ff          32 \
                  --num_heads     2 \
                  --schedule      none \
                  --batch_size    1024 \
                  --num_epochs    500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 2 ]; then
                echo "=== JetClass 2M: PTv3 config1 (index=$IDX) ==="
                python3 train_point_transformer.py \
                  --data_dir             "$DATA_DIR" \
                  --save_dir             "$SAVE_BASE/ptv3_config1/$RUN_TAG" \
                  --dataset              jetclass \
                  --sort_by              kt \
                  --model_size           small \
                  --enc_patch_sizes      10 \
                  --ffn_activation       gelu \
                  --use_patch_messages \
                  --patch_tokenizer_mode learned_pool \
                  --message_proj \
                  --message_gated \
                  --disable_pool \
                  --schedule              none \
                  --batch_size            1024 \
                  --num_epochs            500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 3 ]; then
                echo "=== JetClass 2M: PTv3 config2 (index=$IDX) ==="
                python3 train_point_transformer.py \
                  --data_dir             "$DATA_DIR" \
                  --save_dir             "$SAVE_BASE/ptv3_config2/$RUN_TAG" \
                  --dataset              jetclass \
                  --sort_by              kt \
                  --model_size           small \
                  --enc_patch_sizes      10 \
                  --ffn_activation       gelu \
                  --use_patch_messages \
                  --patch_tokenizer_mode learned_pool \
                  --message_proj \
                  --no_message_gated \
                  --schedule              none \
                  --batch_size            1024 \
                  --num_epochs            500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 4 ]; then
                echo "=== JetClass 2M: PTv3 config3 (index=$IDX) ==="
                python3 train_point_transformer.py \
                  --data_dir             "$DATA_DIR" \
                  --save_dir             "$SAVE_BASE/ptv3_config3/$RUN_TAG" \
                  --dataset              jetclass \
                  --sort_by              kt \
                  --model_size           small \
                  --enc_patch_sizes      10 \
                  --ffn_activation       gelu \
                  --use_patch_messages \
                  --patch_tokenizer_mode mean \
                  --message_proj \
                  --no_message_gated \
                  --schedule              none \
                  --batch_size            1024 \
                  --num_epochs            500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 5 ]; then
                echo "=== JetClass 2M: LorentzNet unconstrained (index=$IDX) ==="
                python3 train_lorentznet.py \
                  --data_dir      "$DATA_DIR" \
                  --save_dir      "$SAVE_BASE/lorentznet/$RUN_TAG" \
                  --dataset       jetclass \
                  --sort_by       kt \
                  --num_particles 150 \
                  --schedule      none \
                  --batch_size    1024 \
                  --num_epochs    500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 6 ]; then
                echo "=== JetClass 2M: L-GATr unconstrained (index=$IDX) ==="
                python3 -m pip install --no-cache-dir lgatr==1.4.4
                python3 train_lgatr.py \
                  --data_dir      "$DATA_DIR" \
                  --save_dir      "$SAVE_BASE/lgatr/$RUN_TAG" \
                  --dataset       jetclass \
                  --sort_by       kt \
                  --num_particles 150 \
                  --schedule      none \
                  --batch_size    1024 \
                  --num_epochs    500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 7 ]; then
                echo "=== JetClass 2M: SAL-T 1.3M-FLOPs config (index=$IDX) ==="
                python3 train_linformer.py \
                  --data_dir            "$DATA_DIR" \
                  --save_dir            "$SAVE_BASE/salt_jetclass/$RUN_TAG" \
                  --dataset             jetclass \
                  --sort_by             kt \
                  --cluster_E \
                  --cluster_F \
                  --convolution \
                  --conv_filter_heights 1 3 5 \
                  --schedule            none \
                  --batch_size          1024 \
                  --num_epochs          500 \
                  --early_stopping_patience 50 \
                  --num_particles       150 \
                  --d_model             20 \
                  --d_ff                40 \
                  --num_heads           4 \
                  --proj_dim            4 \
                  --use_cpe \
                  --cpe_k               8 \
                  --grid_size           0.2 \
                  --num_layers          1 \
                  --aggregation         max \
                  --ffn_activation      relu

              elif [ "$MODEL_IDX" -eq 8 ]; then
                echo "=== JetClass 2M: ParT 1.3M-FLOPs config (index=$IDX) ==="
                python3 train_part.py \
                  --data_dir        "$DATA_DIR" \
                  --save_dir        "$SAVE_BASE/part_d10_h2_pe4_jetclass/$RUN_TAG" \
                  --dataset         jetclass \
                  --sort_by         kt \
                  --num_particles   150 \
                  --embed_dims      10 \
                  --pair_embed_dims 4 \
                  --pair_input_dim  4 \
                  --num_heads       2 \
                  --num_layers      1 \
                  --num_cls_layers  1 \
                  --schedule        none \
                  --batch_size      1024 \
                  --num_epochs      500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 9 ]; then
                echo "=== JetClass 2M: Linformer 1.3M-FLOPs config (index=$IDX) ==="
                python3 train_linformer.py \
                  --data_dir            "$DATA_DIR" \
                  --save_dir            "$SAVE_BASE/linformer_jetclass/$RUN_TAG" \
                  --dataset             jetclass \
                  --sort_by             kt \
                  --schedule            none \
                  --batch_size          1024 \
                  --num_epochs          500 \
                  --early_stopping_patience 50 \
                  --num_particles       150 \
                  --d_model             24 \
                  --d_ff                32 \
                  --num_heads           2 \
                  --proj_dim            4 \
                  --use_cpe \
                  --cpe_k               8 \
                  --grid_size           0.2 \
                  --num_layers          1 \
                  --aggregation         max \
                  --ffn_activation      relu
              fi

          volumeMounts:
            - name: work
              mountPath: /j-jepa-vol
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              memory: 128Gi
              cpu: "8"
              nvidia.com/gpu: "1"
            requests:
              memory: 128Gi
              cpu: "8"
              nvidia.com/gpu: "1"
