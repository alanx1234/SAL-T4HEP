apiVersion: batch/v1
kind: Job
metadata:
  name: alan-jetclass-2m-matched-flops-benchmark
  namespace: cms-ml
spec:
  completions: 6
  parallelism: 6
  completionMode: Indexed
  backoffLimit: 4
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-RTX-A5000
                      - NVIDIA-Quadro-RTX-6000
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-Quadro-RTX-8000
      restartPolicy: Never
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: j-jepa-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      containers:
        - name: training
          image: gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network:latest
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euxo pipefail

              # indices 0-2: PointNet matched-FLOPs trials 0,1,2
              # indices 3-5: Serialized PTv3 matched-FLOPs trials 0,1,2

              IDX=$JOB_COMPLETION_INDEX
              MODEL_IDX=$((IDX / 3))
              TRIAL_IDX=$((IDX % 3))

              REPO_DIR="/tmp/sal_t_jetclass_2m_matched_flops_benchmark"
              REPO_REF="${REPO_REF:-iclr}"
              if [ -d "$REPO_DIR/.git" ]; then
                cd "$REPO_DIR"
                git fetch --all
                git checkout "$REPO_REF"
                git pull || true
              else
                git clone https://github.com/alanx1234/SAL-T4HEP.git "$REPO_DIR"
                cd "$REPO_DIR"
                git checkout "$REPO_REF"
              fi

              DATA_DIR="${DATA_DIR:-/j-jepa-vol/linformer_data/JetClass/kinematics_2m}"
              SAVE_BASE="${SAVE_BASE:-/j-jepa-vol/jetclass_2m_matched_flops_runs}"
              RUN_TAG="idx-${IDX}-trial-${TRIAL_IDX}"
              mkdir -p "$SAVE_BASE"

              test -f "$DATA_DIR/train/features.npy"
              test -f "$DATA_DIR/train/vectors.npy"
              test -f "$DATA_DIR/train/labels.npy"
              test -f "$DATA_DIR/val/features.npy"
              test -f "$DATA_DIR/val/vectors.npy"
              test -f "$DATA_DIR/val/labels.npy"
              test -f "$DATA_DIR/test/features.npy"
              test -f "$DATA_DIR/test/vectors.npy"
              test -f "$DATA_DIR/test/labels.npy"

              cd "$REPO_DIR/scripts"
              python3 -m py_compile \
                train_pointNet.py \
                train_point_transformer.py

              if [ "$MODEL_IDX" -eq 0 ]; then
                echo "=== JetClass 2M matched-FLOPs: PointNet (index=$IDX) ==="
                python3 train_pointNet.py \
                  --data_dir    "$DATA_DIR" \
                  --save_dir    "$SAVE_BASE/pointnet/$RUN_TAG" \
                  --dataset     jetclass \
                  --sort_by     kt \
                  --base_width  21 \
                  --schedule    none \
                  --batch_size  4096 \
                  --test_batch_size 512 \
                  --num_epochs  500 \
                  --early_stopping_patience 50

              elif [ "$MODEL_IDX" -eq 1 ]; then
                echo "=== JetClass 2M matched-FLOPs: Serialized PTv3 (index=$IDX) ==="
                python3 train_point_transformer.py \
                  --data_dir        "$DATA_DIR" \
                  --save_dir        "$SAVE_BASE/ptv3_serialized/$RUN_TAG" \
                  --dataset         jetclass \
                  --sort_by         kt \
                  --model_size      small \
                  --enc_dims        16 32 \
                  --enc_layers      1 1 \
                  --enc_heads       4 4 \
                  --enc_patch_sizes 25 25 \
                  --enc_strides     2 \
                  --grid_size       0.2 \
                  --aggregation     max \
                  --use_serialized_model \
                  --serialize_by    kt \
                  --schedule        none \
                  --batch_size      512 \
                  --test_batch_size 512 \
                  --num_epochs      500 \
                  --early_stopping_patience 50
              fi

          volumeMounts:
            - name: work
              mountPath: /j-jepa-vol
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              memory: 128Gi
              cpu: "8"
              nvidia.com/gpu: "1"
            requests:
              memory: 128Gi
              cpu: "8"
              nvidia.com/gpu: "1"
