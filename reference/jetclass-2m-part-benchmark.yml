apiVersion: batch/v1
kind: Job
metadata:
  name: alan-jetclass-2m-part-benchmark
  namespace: cms-ml
spec:
  completions: 3
  parallelism: 3
  completionMode: Indexed
  backoffLimit: 4
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-RTX-A5000
                      - NVIDIA-Quadro-RTX-6000
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-Quadro-RTX-8000
      restartPolicy: Never
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: j-jepa-vol
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      containers:
        - name: training
          image: gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network:latest
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euxo pipefail

              IDX=$JOB_COMPLETION_INDEX
              TRIAL_IDX=$IDX

              REPO_DIR="/tmp/sal_t_jetclass_2m_part_benchmark"
              REPO_REF="${REPO_REF:-iclr}"
              if [ -d "$REPO_DIR/.git" ]; then
                cd "$REPO_DIR"
                git fetch --all
                git checkout "$REPO_REF"
                git pull || true
              else
                git clone https://github.com/alanx1234/SAL-T4HEP.git "$REPO_DIR"
                cd "$REPO_DIR"
                git checkout "$REPO_REF"
              fi

              DATA_DIR="${DATA_DIR:-/j-jepa-vol/linformer_data/JetClass/kinematics_2m}"
              SAVE_BASE="${SAVE_BASE:-/j-jepa-vol/jetclass_2m_benchmark_runs}"
              RUN_TAG="part-idx-${IDX}-trial-${TRIAL_IDX}"
              mkdir -p "$SAVE_BASE"

              test -f "$DATA_DIR/train/features.npy"
              test -f "$DATA_DIR/train/vectors.npy"
              test -f "$DATA_DIR/train/labels.npy"
              test -f "$DATA_DIR/val/features.npy"
              test -f "$DATA_DIR/val/vectors.npy"
              test -f "$DATA_DIR/val/labels.npy"
              test -f "$DATA_DIR/test/features.npy"
              test -f "$DATA_DIR/test/vectors.npy"
              test -f "$DATA_DIR/test/labels.npy"

              cd "$REPO_DIR/scripts"
              python3 -m py_compile train_part.py

              echo "=== JetClass 2M: ParT 1.3M-FLOPs config (index=$IDX) ==="
              python3 train_part.py \
                --data_dir        "$DATA_DIR" \
                --save_dir        "$SAVE_BASE/part_d10_h2_pe4_jetclass/$RUN_TAG" \
                --dataset         jetclass \
                --sort_by         kt \
                --num_particles   150 \
                --embed_dims      10 \
                --pair_embed_dims 4 \
                --pair_input_dim  4 \
                --num_heads       2 \
                --num_layers      1 \
                --num_cls_layers  1 \
                --schedule        none \
                --batch_size      1024 \
                --num_epochs      500 \
                --early_stopping_patience 50

          volumeMounts:
            - name: work
              mountPath: /j-jepa-vol
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              memory: 128Gi
              cpu: "8"
              nvidia.com/gpu: "1"
            requests:
              memory: 128Gi
              cpu: "8"
              nvidia.com/gpu: "1"
