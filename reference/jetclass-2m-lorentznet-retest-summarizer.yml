apiVersion: batch/v1
kind: Job
metadata:
  name: alan-jetclass-2m-lorentznet-retest-summarize
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: summarize
          image: python:3.11-slim
          command: ["/bin/bash", "-lc"]
          env:
            - name: PYTHONIOENCODING
              value: "utf-8"
            - name: LC_ALL
              value: "C.UTF-8"
            - name: SAVE_BASE
              value: "/j-jepa-vol/jetclass_2m_lorentznet_retest_runs"
            - name: MODEL_NAME
              value: "lorentznet_retest"
            - name: TRIALS
              value: "3"
          args:
            - |
              set -euo pipefail

              cat > /tmp/summarize_jetclass_lorentznet_retest.py << 'PY'
              from __future__ import annotations
              import math
              import os
              import re
              import sys
              from collections import defaultdict
              from pathlib import Path

              sys.stdout.reconfigure(encoding="utf-8")

              SAVE_BASE = Path(os.environ["SAVE_BASE"])
              MODEL_NAME = os.environ.get("MODEL_NAME", "lorentznet_retest")
              TRIALS = int(os.environ.get("TRIALS", "3"))
              LABELS = [
                  "label_QCD", "label_Hbb", "label_Hcc", "label_Hgg", "label_H4q",
                  "label_Hqql", "label_Zqq", "label_Wqq", "label_Tbqq", "label_Tbl",
              ]
              SIGNAL_LABELS = LABELS[1:]

              RX_TEST_ACC = re.compile(r"Test\s*Accuracy:\s*([0-9]*\.?[0-9]+)", re.I)
              RX_ROC_AUC = re.compile(r"ROC\s*AUC:\s*([0-9]*\.?[0-9]+|nan|inf)", re.I)
              RX_TOTAL_PARAMS = re.compile(r"Total\s+params:\s*([0-9]+)", re.I)
              RX_FLOPS = re.compile(r"FLOPs\s*per\s*inference:\s*([0-9]+)", re.I)
              RX_INV_FPR = re.compile(r"1/FPR@0\.8\s+for\s+(\S+):\s*([0-9]*\.?[0-9]+|nan|inf)", re.I)
              RX_BG_REJ = re.compile(r"Bg\s*rejection@0\.8\s+(\S+):\s*([0-9]*\.?[0-9]+|nan|inf)", re.I)

              def number(s):
                  try:
                      return float(s)
                  except Exception:
                      return None

              def last(rx, text, cast=float):
                  hits = rx.findall(text)
                  if not hits:
                      return None
                  hit = hits[-1]
                  if isinstance(hit, tuple):
                      hit = hit[0]
                  try:
                      return cast(hit)
                  except Exception:
                      return None

              def sd(xs):
                  xs = [x for x in xs if x is not None and math.isfinite(x)]
                  if len(xs) <= 1:
                      return 0.0
                  mu = sum(xs) / len(xs)
                  return math.sqrt(sum((x - mu) ** 2 for x in xs) / (len(xs) - 1))

              def compact_uncertainty(x):
                  if x is None or not math.isfinite(x):
                      return ""
                  if abs(x) < 1e-12:
                      return "0"
                  if abs(x) < 0.001:
                      return f"{x:.4f}".rstrip("0").rstrip(".")
                  return f"{x:.3f}".rstrip("0").rstrip(".")

              def fmt(xs, nd_mean=4, nd_sd=4, scale=1.0):
                  vals = [x * scale for x in xs if x is not None and math.isfinite(x)]
                  if not vals:
                      return ""
                  return f"{sum(vals) / len(vals):.{nd_mean}f} ± {sd(vals):.{nd_sd}f}"

              def fmt_roc(xs):
                  vals = [x for x in xs if x is not None and math.isfinite(x)]
                  if not vals:
                      return ""
                  return f"{sum(vals) / len(vals):.4f} ± {compact_uncertainty(sd(vals))}"

              complete = []
              incomplete = []
              for p in SAVE_BASE.rglob("trial-*"):
                  log_path = p / "train.log"
                  if not (p.is_dir() and log_path.is_file()):
                      continue
                  text = log_path.read_text(errors="ignore")
                  if RX_TEST_ACC.search(text) and RX_ROC_AUC.search(text):
                      complete.append((p, text))
                  else:
                      incomplete.append(p)
              complete.sort(key=lambda item: item[0].stat().st_mtime, reverse=True)
              incomplete.sort(key=lambda p: p.stat().st_mtime, reverse=True)
              entries = complete[:TRIALS]

              if incomplete:
                  print(f"[WARN] ignored {len(incomplete)} incomplete retest logs under {SAVE_BASE}")
              if len(entries) < TRIALS:
                  print(f"[WARN] found {len(entries)}/{TRIALS} complete retest trials under {SAVE_BASE}")
              if not entries:
                  raise SystemExit("[FATAL] No complete LorentzNet retest trials found")

              parsed = []
              for d, text in entries:
                  inv_fpr = defaultdict(list)
                  bg_rej = defaultdict(list)
                  for label, value in RX_INV_FPR.findall(text):
                      v = number(value)
                      if v is not None:
                          inv_fpr[label.lower()].append(v)
                  for label, value in RX_BG_REJ.findall(text):
                      v = number(value)
                      if v is not None:
                          bg_rej[label.lower()].append(v)
                  inv = {}
                  for key, vals in inv_fpr.items():
                      if vals:
                          inv[key] = vals[-1]
                  for key, vals in bg_rej.items():
                      if vals and key not in inv:
                          inv[key] = vals[-1]
                  parsed.append({
                      "trial_dir": str(d),
                      "acc": last(RX_TEST_ACC, text, float),
                      "auc": last(RX_ROC_AUC, text, float),
                      "params": last(RX_TOTAL_PARAMS, text, int),
                      "flops": last(RX_FLOPS, text, int),
                      "inv": inv,
                  })

              row = {
                  "model": MODEL_NAME,
                  "Test Accuracy (%)": fmt([p["acc"] for p in parsed], 2, 2, 100.0),
                  "ROC AUC": fmt_roc([p["auc"] for p in parsed]),
                  "# Params": str(next((p["params"] for p in parsed if p["params"] is not None), "")),
                  "FLOPs": str(next((p["flops"] for p in parsed if p["flops"] is not None), "")),
              }
              per_trial_avg = []
              for label in LABELS:
                  vals = [p["inv"].get(label.lower()) for p in parsed]
                  row[f"1/FPR {label}"] = fmt(vals, 4, 4)
              for p in parsed:
                  vals = [p["inv"].get(label.lower()) for label in SIGNAL_LABELS]
                  vals = [v for v in vals if v is not None and math.isfinite(v)]
                  if vals:
                      per_trial_avg.append(sum(vals) / len(vals))
              row["Avg 1/FPR"] = fmt(per_trial_avg, 2, 2)
              row["Avg Bg Rej"] = row["Avg 1/FPR"]

              cols = (
                  ["model", "Test Accuracy (%)", "ROC AUC"]
                  + [f"1/FPR {label}" for label in LABELS]
                  + ["Avg 1/FPR", "# Params", "FLOPs"]
              )
              compact_cols = ["model", "Test Accuracy (%)", "ROC AUC", "Avg Bg Rej", "# Params", "FLOPs"]

              print("\n===== JetClass 2M LorentzNet Retest (Markdown) =====\n")
              print("| " + " | ".join(cols) + " |")
              print("| " + " | ".join(["---"] * len(cols)) + " |")
              print("| " + " | ".join(str(row.get(c, "")) for c in cols) + " |")
              print("\n===== JetClass 2M LorentzNet Retest Compact (Markdown) =====\n")
              print("| " + " | ".join(compact_cols) + " |")
              print("| " + " | ".join(["---"] * len(compact_cols)) + " |")
              print("| " + " | ".join(str(row.get(c, "")) for c in compact_cols) + " |")
              print("\n===== JetClass 2M LorentzNet Retest TSV =====\n")
              print("\t".join(cols))
              print("\t".join(str(row.get(c, "")) for c in cols))
              print("\n===== JetClass 2M LorentzNet Retest Compact TSV =====\n")
              print("\t".join(compact_cols))
              print("\t".join(str(row.get(c, "")) for c in compact_cols))
              print("\n===== Trials Used =====\n")
              for p in parsed:
                  print(p["trial_dir"])
              PY

              python /tmp/summarize_jetclass_lorentznet_retest.py

          volumeMounts:
            - name: work
              mountPath: /j-jepa-vol
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: j-jepa-vol
