apiVersion: batch/v1
kind: Job
metadata:
  name: alan-hls4ml-baseline-eval
  namespace: cms-ml
  labels:
    jobgroup: hls4ml-paper-baseline-multiplicity-eval
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        jobgroup: hls4ml-paper-baseline-multiplicity-eval
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-RTX-A5000
                      - NVIDIA-Quadro-RTX-6000
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-Quadro-RTX-8000
      containers:
        - name: evaluation
          image: gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network:latest
          command: ["/bin/bash", "-lc"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONIOENCODING
              value: "utf-8"
            - name: LC_ALL
              value: "C.UTF-8"
            - name: REPO_REF
              value: "iclr"
            - name: DATA_DIR
              value: "/j-jepa-vol/l1-jet-id/data/jetid/processed"
            - name: CHUNK_SIZE
              value: "32768"
            - name: POST_RUN_SLEEP_SECONDS
              value: "86400"
          args:
            - |
              set -euo pipefail

              REPO_DIR="/tmp/sal_t_hls4ml_paper_baseline_eval"

              git clone --branch "$REPO_REF" --single-branch \
                https://github.com/alanx1234/SAL-T4HEP.git "$REPO_DIR"
              cd "$REPO_DIR"

              test -f "$DATA_DIR/x_val_robust_150const_ptetaphi.npy"
              test -f "$DATA_DIR/y_val_robust_150const_ptetaphi.npy"
              python3 -m py_compile scripts/evaluate_hls4ml_multiplicity.py

              for MODEL in salt linformer pointnet; do
                echo "Starting model=$MODEL"
                python3 scripts/evaluate_hls4ml_multiplicity.py \
                  --model "$MODEL" \
                  --data-dir "$DATA_DIR" \
                  --chunk-size "$CHUNK_SIZE"
              done

              echo "Evaluation finished; sleeping for log retrieval"
              sleep "$POST_RUN_SLEEP_SECONDS"
          volumeMounts:
            - name: work
              mountPath: /j-jepa-vol
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 2Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: j-jepa-vol
