apiVersion: batch/v1
kind: Job
metadata:
  name: alan-hls4ml-phat-eval
  namespace: cms-ml
  labels:
    jobgroup: hls4ml-phat-multiplicity-eval
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        jobgroup: hls4ml-phat-multiplicity-eval
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-RTX-A5000
                      - NVIDIA-Quadro-RTX-6000
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-Quadro-RTX-8000
      containers:
        - name: evaluation
          image: gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network:latest
          command: ["/bin/bash", "-lc"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONIOENCODING
              value: "utf-8"
            - name: LC_ALL
              value: "C.UTF-8"
            - name: REPO_REF
              value: "iclr"
            - name: DATA_DIR
              value: "/j-jepa-vol/l1-jet-id/data/jetid/processed"
            - name: CHUNK_SIZE
              value: "32768"
            - name: POST_RUN_SLEEP_SECONDS
              value: "86400"
            - name: PHAT_MODEL_MODULE
              value: "models.PointTransformerV3TF_checkpoint_compat"
            - name: PHAT_MODEL_SOURCE_COMMIT
              value: "ed0f146600a1fe8d1f14eb93225ae5a17adafb55"
          args:
            - |
              set -euo pipefail

              REPO_DIR="/tmp/sal_t_hls4ml_phat_eval"

              git clone --branch "$REPO_REF" --single-branch \
                https://github.com/alanx1234/SAL-T4HEP.git "$REPO_DIR"
              cd "$REPO_DIR"

              git show \
                "$PHAT_MODEL_SOURCE_COMMIT:models/PointTransformerV3TF.py" \
                > models/PointTransformerV3TF_checkpoint_compat.py
              echo "PHAT compatibility model source: $PHAT_MODEL_SOURCE_COMMIT"

              test -f "$DATA_DIR/x_val_robust_150const_ptetaphi.npy"
              test -f "$DATA_DIR/y_val_robust_150const_ptetaphi.npy"
              python3 -m py_compile scripts/evaluate_hls4ml_multiplicity.py

              python3 scripts/evaluate_hls4ml_multiplicity.py \
                --model phatjet \
                --data-dir "$DATA_DIR" \
                --chunk-size "$CHUNK_SIZE"

              echo "Evaluation finished; sleeping for log retrieval"
              sleep "$POST_RUN_SLEEP_SECONDS"
          volumeMounts:
            - name: work
              mountPath: /j-jepa-vol
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 1Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: j-jepa-vol
